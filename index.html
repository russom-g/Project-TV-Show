<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Russom Gebresmeskel russom-g</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>

  <body>
     <label>
      Search
      <input type="search" id="search" name="q" placeholder="Search term" /> 
    </label>
    <div id="ep-number-container">
      <p><span id="displayed-eps-num"></span>/<span id="eps-num"></span></p>
    </div>
    <div id="root"></div>
    <footer>
      Data from <a href="https://www.tvmaze.com/">TVmaze</a>, licensed under
      <a href="https://creativecommons.org/licenses/by-sa/4.0">CC BY-SA 4.0</a>.
    </footer>

    <template id="tv-show-card">
      <section>
        <h3>Episode title</h3>
        <img alt="" />
        <p>Summary</p>
        <a>Link text</a>
      </section>
    </template>

    <!-- Loads a provided function called getAllEpisodes() which returns all episodes -->
    <script src="episodes.js"></script>

    <!-- Loads YOUR javascript code -->
    <script src="script.js"></script>
  </body>
</html>
